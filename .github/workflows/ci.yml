name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --bind_ip_all
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/hairbook_ci_test?replicaSet=rs0
      RUN_REAL_MONGO_TRANSACTION_TESTS: true
      JWT_SECRET: ci-test-secret
      CLIENT_URL: http://localhost:5173
      RATE_LIMIT_ENABLED: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            if echo > /dev/tcp/127.0.0.1/27017 2>/dev/null; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 2
          done

      - name: Initialize MongoDB replica set
        run: |
          for i in $(seq 1 30); do
            if mongosh --host 127.0.0.1:27017 --quiet --eval '
              try {
                rs.initiate({
                  _id: "rs0",
                  members: [{ _id: 0, host: "127.0.0.1:27017" }]
                });
              } catch (error) {
                if (error.codeName !== "AlreadyInitialized") throw error;
              }
            '; then
              break
            fi
            echo "Initializing MongoDB replica set... ($i/30)"
            sleep 2
          done

          for i in $(seq 1 30); do
            if mongosh --host 'mongodb://127.0.0.1:27017/?replicaSet=rs0' --quiet --eval '
              const status = rs.status();
              if (status.myState !== 1) quit(1);
            '; then
              echo "MongoDB replica set primary is writable"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "MongoDB replica set did not become a writable primary" >&2
              exit 1
            fi
            echo "Waiting for MongoDB writable primary... ($i/30)"
            sleep 2
          done

      - name: Run backend tests
        run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
      VITE_API_ORIGIN: http://localhost:5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run linter
        run: npm run lint
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Run build
        run: npm run build
        working-directory: frontend
